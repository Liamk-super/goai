<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">LaunchScope package run modes</title><desc id="desc">Three distinct paths: validation, recorded demo, and authorized live execution.</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1A3142" flood-opacity=".14"/></filter><style>.h{font:700 32px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#102B3C}.t{font:700 24px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#FFF}.b{font:500 18px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#274656}.w{font:500 17px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#FFF}.s{font:500 15px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#E6F0F4}.n{font:700 17px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#102B3C}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#355E72"/></marker></defs>
  <rect width="1600" height="820" fill="#F8FBFD"/><text x="800" y="57" text-anchor="middle" class="h">三种运行模式的边界</text><text x="800" y="89" text-anchor="middle" class="b">先选模式，再解释证据；本地可复现不等于真实 Live E2E</text>
  <g filter="url(#s)"><rect x="80" y="140" width="430" height="560" rx="24" fill="#EDF7F0"/><rect x="80" y="140" width="430" height="94" rx="24" fill="#34734A"/><text x="295" y="197" text-anchor="middle" class="t">A · Validate</text><text x="295" y="278" text-anchor="middle" class="n">RUN_AGENTTEAMS_PACKAGE.ps1</text><text x="295" y="308" text-anchor="middle" class="n">-Mode Validate</text><path d="M295 336V390" stroke="#34734A" stroke-width="4" marker-end="url(#a)"/><rect x="135" y="406" width="320" height="88" rx="14" fill="#FFF"/><text x="295" y="443" text-anchor="middle" class="b">资源/合同校验</text><text x="295" y="471" text-anchor="middle" class="b">重新生成 5 个 ZIP</text><path d="M295 494V548" stroke="#34734A" stroke-width="4" marker-end="url(#a)"/><rect x="135" y="563" width="320" height="82" rx="14" fill="#D7EEDC"/><text x="295" y="598" text-anchor="middle" class="b">可复现构建证据</text><text x="295" y="624" text-anchor="middle" class="b">不调用外部系统</text><text x="295" y="680" text-anchor="middle" class="s" style="fill:#34734A">适合：评审 / 离线验收</text></g>
  <g filter="url(#s)"><rect x="585" y="140" width="430" height="560" rx="24" fill="#EEF4FA"/><rect x="585" y="140" width="430" height="94" rx="24" fill="#456F9E"/><text x="800" y="197" text-anchor="middle" class="t">B · Recorded</text><text x="800" y="278" text-anchor="middle" class="n">-Mode Recorded</text><text x="800" y="308" text-anchor="middle" class="n">-Bootstrap -NoBrowser</text><path d="M800 336V390" stroke="#456F9E" stroke-width="4" marker-end="url(#a)"/><rect x="640" y="406" width="320" height="88" rx="14" fill="#FFF"/><text x="800" y="443" text-anchor="middle" class="b">本地标注页面 / 服务</text><text x="800" y="471" text-anchor="middle" class="b">合成样例与本地流程</text><path d="M800 494V548" stroke="#456F9E" stroke-width="4" marker-end="url(#a)"/><rect x="640" y="563" width="320" height="82" rx="14" fill="#DCE8F4"/><text x="800" y="598" text-anchor="middle" class="b">不启动 AgentTeams 桥</text><text x="800" y="624" text-anchor="middle" class="b">不调用模型 / 搜索</text><text x="800" y="680" text-anchor="middle" class="s" style="fill:#456F9E">适合：界面演示 / 本地回归</text></g>
  <g filter="url(#s)"><rect x="1090" y="140" width="430" height="560" rx="24" fill="#FFF2EA"/><rect x="1090" y="140" width="430" height="94" rx="24" fill="#B8652F"/><text x="1305" y="197" text-anchor="middle" class="t">C · Live</text><text x="1305" y="278" text-anchor="middle" class="n">-Mode Live</text><text x="1305" y="308" text-anchor="middle" class="n">私有 .env.demo.local</text><path d="M1305 336V390" stroke="#B8652F" stroke-width="4" marker-end="url(#a)"/><rect x="1145" y="406" width="320" height="88" rx="14" fill="#FFF"/><text x="1305" y="443" text-anchor="middle" class="b">preflight + 授权案例</text><text x="1305" y="471" text-anchor="middle" class="b">预算 / 凭据 / 域名范围</text><path d="M1305 494V548" stroke="#B8652F" stroke-width="4" marker-end="url(#a)"/><rect x="1145" y="563" width="320" height="82" rx="14" fill="#FBE0D0"/><text x="1305" y="598" text-anchor="middle" class="b">AgentTeams · Matrix · MQ</text><text x="1305" y="624" text-anchor="middle" class="b">模型/账单/对象存储核验</text><text x="1305" y="680" text-anchor="middle" class="s" style="fill:#A65023">适合：获授权的真实验收</text></g>
  <rect x="292" y="748" width="1016" height="44" rx="22" fill="#F6D6D3"/><text x="800" y="777" text-anchor="middle" class="b">没有授权案例 → BLOCKED_NO_AUTHORIZED_CASE；未知外部结果 → NEEDS_ATTENTION，绝不自动重试</text>
