receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  attributes/body_guard:
    actions:
      - {key: prompt, action: delete}
      - {key: system_prompt, action: delete}
      - {key: messages, action: delete}
      - {key: material_body, action: delete}
      - {key: evidence_body, action: delete}
      - {key: report_body, action: delete}
      - {key: private_reasoning, action: delete}
      - {key: authorization, action: delete}
      - {key: access_token, action: delete}
      - {key: refresh_token, action: delete}
  batch: {}

exporters:
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/body_guard, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/body_guard, batch]
      exporters: [debug]
