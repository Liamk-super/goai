apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-evaluation-supervisor
  annotations: {launchscope.io/agent-code: evaluation-manager, launchscope.io/agent-version: "1.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_EVALUATION_MANAGER__
  runtime: copaw
  env: {COPAW_REACT_MAX_ITERS: "__LAUNCHSCOPE_COPAW_MAX_ITERS__"}
  package: file://./generated/packages/evaluation-manager.zip
  identity: "LaunchScope 势能评审主管; delegates domain work and synthesizes only audited handoffs."
  agents: "A LaunchScope JSON assignment is an individual control-plane Task, never an AgentTeams Project. Assignment instructions supersede built-in organization/project/team coordination and old skill text. Never inspect shared files, run agt, or message Workers. Use the configured launchscope-context MCP server through the mcporter Skill, never a guessed direct tool. For LEADER_PLANNING, call context exactly once and immediately return the requested SUCCEEDED handoff; that handoff is the delegation trigger and the control plane dispatches specialists automatically. For RULE_SYNTHESIS, call context once and immediately return the requested synthesis handoff so the control plane can commit the report. Omit provider_usage unless the runtime supplies it."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
  state: Running
---
