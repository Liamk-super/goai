apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-evaluation-supervisor
  annotations: {launchscope.io/agent-code: evaluation-manager, launchscope.io/agent-version: "1.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_EVALUATION_MANAGER__
  runtime: qwenpaw
  package: file://./generated/packages/evaluation-manager.zip
  identity: "LaunchScope 势能评审主管; delegates domain work and synthesizes only audited handoffs."
  agents: "Follow the frozen Run Manifest. Delegate first. Never manufacture specialist findings or write business state."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-product-engineering
  annotations: {launchscope.io/agent-code: product-engineering, launchscope.io/agent-version: "1.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_PRODUCT_ENGINEERING__
  runtime: qwenpaw
  package: file://./generated/packages/product-engineering.zip
  identity: "LaunchScope 产品与团队专家; assesses implementation, feasibility, and delivery evidence."
  agents: "Use only assigned read-only tools. Return AgentHandoffV1 with Evidence IDs; never write business state."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
    - {name: browser-audit, url: "http://host.docker.internal:8091/mcp/browser-audit/", transport: http}
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-user-evidence
  annotations: {launchscope.io/agent-code: user-evidence, launchscope.io/agent-version: "1.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_USER_EVIDENCE__
  runtime: qwenpaw
  package: file://./generated/packages/user-evidence.zip
  identity: "LaunchScope 用户共创 Agent; assesses real user evidence, demand signals, and validation gaps."
  agents: "Do not present simulated users as real evidence. Return AgentHandoffV1 with linked Evidence IDs."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
    - {name: browser-audit, url: "http://host.docker.internal:8091/mcp/browser-audit/", transport: http}
    - {name: public-research-search, url: "http://host.docker.internal:8091/mcp/public-research-search/", transport: http}
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-business-investment
  annotations: {launchscope.io/agent-code: business-investment, launchscope.io/agent-version: "1.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_BUSINESS_INVESTMENT__
  runtime: qwenpaw
  package: file://./generated/packages/business-investment.zip
  identity: "LaunchScope 投资与商业 Agent; assesses model, channels, cost, growth, and investment risk."
  agents: "Separate hypotheses from sourced claims. Return AgentHandoffV1; never contact customers or publish."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
    - {name: public-research-search, url: "http://host.docker.internal:8091/mcp/public-research-search/", transport: http}
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-geo-policy-trend
  annotations: {launchscope.io/agent-code: geo-policy-trend, launchscope.io/agent-version: "1.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_GEO_POLICY_TREND__
  runtime: qwenpaw
  package: file://./generated/packages/geo-policy-trend.zip
  identity: "LaunchScope 时间地域 Agent; assesses region, policy, platform rules, trend direction, and validity."
  agents: "Every time-sensitive claim needs region, fetched_at, valid_until, trend_signal, and Evidence IDs. Return AgentHandoffV1."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
    - {name: public-research-search, url: "http://host.docker.internal:8091/mcp/public-research-search/", transport: http}
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-evidence-auditor
  annotations: {launchscope.io/agent-code: evidence-auditor, launchscope.io/agent-version: "1.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_EVIDENCE_AUDITOR__
  runtime: qwenpaw
  package: file://./generated/packages/evidence-auditor.zip
  identity: "LaunchScope 证据校准 Agent; independently accepts, downgrades, rejects, or requests evidence."
  agents: "Never rewrite an original Finding. Return exactly one audit_results item for every durable Finding, using ACCEPTED, DOWNGRADED, REJECTED, or NEEDS_MORE_EVIDENCE."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: launchscope-potential-review
spec:
  description: "LaunchScope evidence-driven 1+5 product potential review team"
  heartbeatEvery: 5m
  peerMentions: true
  humanMembers:
    - {name: launchscope-human-coordinator, role: coordinator}
  workerMembers:
    - {name: launchscope-evaluation-supervisor, role: team_leader}
    - {name: launchscope-product-engineering, role: worker}
    - {name: launchscope-user-evidence, role: worker}
    - {name: launchscope-business-investment, role: worker}
    - {name: launchscope-geo-policy-trend, role: worker}
    - {name: launchscope-evidence-auditor, role: worker}
---
apiVersion: agentteams.io/v1beta1
kind: Human
metadata:
  name: launchscope-human-coordinator
spec:
  displayName: LaunchScope Human Coordinator
  permissionLevel: 2
  accessibleTeams: [launchscope-potential-review]
  accessibleWorkers: []
  note: "LaunchScope bridge principal; credentials are provisioned outside Git"
