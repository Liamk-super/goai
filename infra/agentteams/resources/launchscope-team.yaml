apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: launchscope-potential-review
spec:
  description: "LaunchScope evidence-driven 1+5 product potential review team"
  peerMentions: true
  humanMembers:
    - {name: launchscope-human-coordinator, role: coordinator}
  workerMembers:
    - {name: launchscope-evaluation-supervisor, role: team_leader}
    - {name: launchscope-product-engineering, role: worker}
    - {name: launchscope-user-evidence, role: worker}
    - {name: launchscope-business-investment, role: worker}
    - {name: launchscope-geo-policy-trend, role: worker}
    - {name: launchscope-evidence-auditor, role: worker}
---
apiVersion: agentteams.io/v1beta1
kind: Human
metadata:
  name: launchscope-human-coordinator
spec:
  displayName: LaunchScope Human Coordinator
  permissionLevel: 2
  accessibleTeams: [launchscope-potential-review]
  accessibleWorkers: []
  note: "LaunchScope bridge principal; credentials are provisioned outside Git"
