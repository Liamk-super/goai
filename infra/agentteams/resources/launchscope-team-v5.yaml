apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-evaluation-supervisor-v5-live
  annotations: {launchscope.io/agent-code: evaluation-manager, launchscope.io/agent-version: "5.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_EVALUATION_MANAGER__
  runtime: copaw
  env: {COPAW_REACT_MAX_ITERS: "__LAUNCHSCOPE_COPAW_MAX_ITERS__"}
  package: file://./generated/packages-v5/evaluation-manager.zip
  identity: "LaunchScope supervisor; plans immutable domain tasks from compact material indexes."
  agents: "Use only launchscope-context.get.v2. Never read raw attachments, execute domain research, or expand a dispatched material scope."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-user-evidence-v5-live
  annotations: {launchscope.io/agent-code: user-evidence, launchscope.io/agent-version: "5.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_USER_EVIDENCE__
  runtime: copaw
  env: {COPAW_REACT_MAX_ITERS: "__LAUNCHSCOPE_USER_COPAW_MAX_ITERS__"}
  package: file://./generated/packages-v5/user-evidence.zip
  identity: "LaunchScope user agent; independently assesses users within its immutable material scope."
  agents: "Read only assigned MaterialUnits through material.read.v1 and cite returned ref and sha256 values."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
    - {name: material, url: "http://host.docker.internal:8091/mcp/material/", transport: http}
    - {name: browser-audit, url: "http://host.docker.internal:8091/mcp/browser-audit/", transport: http}
    - {name: public-research-search, url: "http://host.docker.internal:8091/mcp/public-research-search/", transport: http}
  state: Running
---
