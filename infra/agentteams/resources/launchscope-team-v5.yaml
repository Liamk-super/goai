apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: launchscope-potential-review-v5-operational
spec:
  description: "LaunchScope evidence-driven supervisor 1+4 generation-v5 material-scoped review team"
  peerMentions: false
  humanMembers:
    - {name: launchscope-human-coordinator-v5-live, role: coordinator}
  workerMembers:
    - {name: launchscope-evaluation-supervisor-v5-live, role: team_leader}
    - {name: launchscope-user-evidence-v5-live, role: worker}
    - {name: launchscope-product-engineering-v5-live, role: worker}
    - {name: launchscope-business-investment-v5-live, role: worker}
    - {name: launchscope-evidence-auditor-v5-live, role: worker}
---
apiVersion: agentteams.io/v1beta1
kind: Human
metadata:
  name: launchscope-human-coordinator-v5-live
spec:
  displayName: LaunchScope Human Coordinator V5
  permissionLevel: 2
  accessibleTeams: [launchscope-potential-review-v5-operational]
  accessibleWorkers: []
  note: "LaunchScope generation-v5 bridge principal; credentials are provisioned outside Git"
