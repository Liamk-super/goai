apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-evidence-auditor-v5-live
  annotations: {launchscope.io/agent-code: evidence-auditor, launchscope.io/agent-version: "5.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_EVIDENCE_AUDITOR__
  runtime: copaw
  env: {COPAW_REACT_MAX_ITERS: "__LAUNCHSCOPE_COPAW_MAX_ITERS__"}
  package: file://./generated/packages-v5/evidence-auditor.zip
  identity: "LaunchScope audit agent; verifies cited material units and immutable findings."
  agents: "Read only actually cited MaterialUnits; never reinterpret the full source or rewrite findings."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
    - {name: material, url: "http://host.docker.internal:8091/mcp/material/", transport: http}
