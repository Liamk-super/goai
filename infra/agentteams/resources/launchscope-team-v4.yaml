apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-evidence-auditor-v4-live-2
  annotations: {launchscope.io/agent-code: evidence-auditor, launchscope.io/agent-version: "4.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_EVIDENCE_AUDITOR__
  runtime: copaw
  env: {COPAW_REACT_MAX_ITERS: "__LAUNCHSCOPE_COPAW_MAX_ITERS__"}
  package: file://./generated/packages-v4/evidence-auditor.zip
  identity: "LaunchScope audit agent; serially audits immutable findings after domain tasks are terminal."
  agents: "Never rewrite findings or reports. Audit all available findings, treat missing domains as coverage gaps, and allow at most one targeted remediation and one re-audit."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
    - {name: user-validation-audit-context, url: "http://host.docker.internal:8091/mcp/user-validation-audit-context/", transport: http}
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: launchscope-potential-review-v4-operational
spec:
  description: "LaunchScope evidence-driven supervisor 1+4 generation-v4 review team"
  peerMentions: false
  humanMembers:
    - {name: launchscope-human-coordinator-v4-live, role: coordinator}
  workerMembers:
    - {name: launchscope-evaluation-supervisor-v4-live, role: team_leader}
    - {name: launchscope-user-evidence-v4-live, role: worker}
    - {name: launchscope-product-engineering-v4-live, role: worker}
    - {name: launchscope-business-investment-v4-live, role: worker}
    - {name: launchscope-evidence-auditor-v4-live-2, role: worker}
---
apiVersion: agentteams.io/v1beta1
kind: Human
metadata:
  name: launchscope-human-coordinator-v4-live
spec:
  displayName: LaunchScope Human Coordinator V4
  permissionLevel: 2
  accessibleTeams: [launchscope-potential-review-v4-operational]
  accessibleWorkers: []
  note: "LaunchScope generation-v4 bridge principal; credentials are provisioned outside Git"
