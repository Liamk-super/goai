apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-evaluation-supervisor-v4-live
  annotations: {launchscope.io/agent-code: evaluation-manager, launchscope.io/agent-version: "4.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_EVALUATION_MANAGER__
  runtime: copaw
  env: {COPAW_REACT_MAX_ITERS: "__LAUNCHSCOPE_COPAW_MAX_ITERS__"}
  package: file://./generated/packages-v4/evaluation-manager.zip
  identity: "LaunchScope supervisor; only plans, controlled-replans, and synthesizes audited inputs."
  agents: "Use only launchscope-context. Never execute domain research, create tasks, change budget, score, alter audit results, or write business state. Return only the assigned generation-v4 contract."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-user-evidence-v4-live
  annotations: {launchscope.io/agent-code: user-evidence, launchscope.io/agent-version: "4.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_USER_EVIDENCE__
  runtime: copaw
  env: {COPAW_REACT_MAX_ITERS: "__LAUNCHSCOPE_USER_COPAW_MAX_ITERS__"}
  package: file://./generated/packages-v4/user-evidence.zip
  identity: "LaunchScope user agent; independently assesses users, alternatives, region, and freshness."
  agents: "Execute only the assigned first-round or targeted-remediation task. Never dispatch or mention peers. Return an immutable report_ref and evidence-grounded findings with region and time validity."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
    - {name: browser-audit, url: "http://host.docker.internal:8091/mcp/browser-audit/", transport: http}
    - {name: public-research-search, url: "http://host.docker.internal:8091/mcp/public-research-search/", transport: http}
  state: Running
---
