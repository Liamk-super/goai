apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-evaluation-supervisor-v6-live
  annotations: {launchscope.io/agent-code: evaluation-manager, launchscope.io/agent-version: "6.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_EVALUATION_MANAGER__
  runtime: copaw
  env: {COPAW_REACT_MAX_ITERS: "__LAUNCHSCOPE_COPAW_MAX_ITERS__"}
  package: file://./generated/packages-v6/evaluation-manager.zip
  identity: "LaunchScope supervisor; plans scoped work and synthesizes one immutable report without changing deterministic scores."
  agents: "Use only launchscope-context.get.v2. Preserve deterministic scores and emit the assigned v2.2 report contract."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: launchscope-user-evidence-v6-live
  annotations: {launchscope.io/agent-code: user-evidence, launchscope.io/agent-version: "6.0"}
spec:
  model: __LAUNCHSCOPE_MODEL_USER_EVIDENCE__
  runtime: copaw
  env: {COPAW_REACT_MAX_ITERS: "__LAUNCHSCOPE_USER_COPAW_MAX_ITERS__"}
  package: file://./generated/packages-v6/user-evidence.zip
  identity: "LaunchScope user agent; produces one immutable cited user report from its assigned scope."
  agents: "Read only assigned MaterialUnits and permitted sources; save and return one SpecialistReportDocumentV2."
  mcpServers:
    - {name: launchscope-context, url: "http://host.docker.internal:8091/mcp/context/", transport: http}
    - {name: material, url: "http://host.docker.internal:8091/mcp/material/", transport: http}
    - {name: browser-audit, url: "http://host.docker.internal:8091/mcp/browser-audit/", transport: http}
    - {name: public-research-search, url: "http://host.docker.internal:8091/mcp/public-research-search/", transport: http}
  state: Running
---
