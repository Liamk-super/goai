apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: launchscope-potential-review-v6-operational
spec:
  description: "LaunchScope evidence-driven supervisor 1+4 generation-v6 report-v2.2 review team"
  peerMentions: false
  humanMembers:
    - {name: launchscope-human-coordinator-v6-live, role: coordinator}
  workerMembers:
    - {name: launchscope-evaluation-supervisor-v6-live, role: team_leader}
    - {name: launchscope-user-evidence-v6-live, role: worker}
    - {name: launchscope-product-engineering-v6-live, role: worker}
    - {name: launchscope-business-investment-v6-live, role: worker}
    - {name: launchscope-evidence-auditor-v6-live, role: worker}
---
apiVersion: agentteams.io/v1beta1
kind: Human
metadata:
  name: launchscope-human-coordinator-v6-live
spec:
  displayName: LaunchScope Human Coordinator V6
  permissionLevel: 2
  accessibleTeams: [launchscope-potential-review-v6-operational]
  accessibleWorkers: []
  note: "LaunchScope generation-v6 report-v2.2 bridge principal; credentials are provisioned outside Git"
