name: Deploy static demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/github-pages/**"
      - ".github/workflows/deploy-github-pages-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/github-pages
      - name: Deploy static demo
        id: deployment
        uses: actions/deploy-pages@v4
