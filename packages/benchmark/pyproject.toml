[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "launchscope-benchmark"
version = "0.1.0"
description = "Canonical LaunchScope Benchmark V1 validator, scorer and adapter boundary"
requires-python = ">=3.11,<3.15"
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6.0.2,<7"]

[project.scripts]
launchscope-benchmark = "launchscope_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
launchscope_benchmark = ["py.typed"]
