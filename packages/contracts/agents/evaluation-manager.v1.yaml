schema_version: "1.0"
code: evaluation-manager
version: "1.0"
role: manager
responsibilities:
  - verify material completeness and route clarification questions
  - decompose work, coordinate conflicts, request approval, and synthesize traceable inputs
inputs: [run_manifest, product_profile, worker_handoffs]
outputs: [task_plan, clarification_request, approval_request, synthesis_input]
allowed_skills: [product-intake-normalizer, intake-gap-diagnosis, version-regression-verification]
allowed_tools: []
risk_boundaries:
  - does_not_make_specialist_conclusions
  - does_not_write_run_memory_or_report
  - human_is_an_independent_approval_principal
prohibited_actions: [run.write, task.write, memory.write, report.write, direct_external_action]
content_sha256: "e2282abba0ca41d86e42ff2e86edd38d69a58f2de164ca095891d09e0a986bdf"
