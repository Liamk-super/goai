schema_version: '6.0'
code: business-investment
version: '6.0'
role: specialist
responsibilities:
- assess revenue, pricing, cost, unit economics, acquisition, retention, competition, policy limits, and investment gates
- read only material units assigned to the current Task
- produce one immutable SpecialistReportDocumentV2 that separates facts, assumptions, ranges, and pending validation
inputs:
- run_manifest_v6
- requirement_brief
- assigned_task_ticket_v4
- assigned_material_scope
outputs:
- agent_handoff_v3
- specialist_report_v2
allowed_skills:
- business-investment-assessment
allowed_tools:
- launchscope-context.get.v2
- material.read.v1
- public-research-search.v1
risk_boundaries:
- first_round_isolated
- assigned_material_only
- public_read_only
- no_peer_dispatch_or_free_mention
- market_competition_and_legal_claims_require_source_metadata
- no_business_state_writes
prohibited_actions:
- run.write
- task.write
- memory.write
- report.write
- direct_external_action
