[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "launchscope-contracts"
version = "0.1.0"
description = "LaunchScope versioned OpenAPI and JSON Schema contracts"
requires-python = ">=3.11,<3.15"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
  "referencing>=0.35,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
launchscope_contracts = ["py.typed"]

