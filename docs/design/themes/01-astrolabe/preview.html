<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>主题归档 · 01 星盘 / 航海罗经</title>
<style>
/* ============================================================================
   LaunchScope / 势能引擎 — 视觉层
   ----------------------------------------------------------------------------
   隐喻：航海罗经（Marine Compass / Astrolabe）
   一台可复验的测量仪器，不是一台抽奖机。刻度先于结论。

   结构：两层 token。
     L1 --sw-*    原子色板，只描述颜色本身，不带含义
     L2 语义 token 引用 L1，组件只用语义 token
   规则：
     · 盘面全中性，颜色只承载状态（唯一强调 = 朱红）
     · 阴影零饱和度（纯黑 alpha），不用彩色 glow
     · 圆角只有 2 / 6 / 14px + 50%，没有胶囊按钮
     · 中文字距为正，行高 ≥1.05；负字距只给拉丁与数字
     · 只动 transform / opacity
     · 字体全部 OFL / Apache-2.0，可商用零授权费
   ========================================================================= */

@import url("https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap");

/* ─────────────────────── L1 · 原子色板 ─────────────────────── */

:root {
  /* 纸 —— 去黄的中性米，刻意避开 #faf9f5 那条奶油色路径 */
  --sw-paper-000: #f4f3ef;
  --sw-paper-050: #efeeea;
  --sw-paper-100: #e7e6e1;
  --sw-paper-150: #dcdbd5;
  --sw-paper-200: #cdccc5;

  /* 墨 —— 石墨，不用纯黑 */
  --sw-ink-900: #16181a;
  --sw-ink-800: #23262a;
  --sw-ink-700: #33373c;
  --sw-ink-500: #5c6167;
  --sw-ink-400: #7d8288;
  --sw-ink-300: #9b9fa4;

  /* 黄铜 —— 航海仪器的金属，仅用于仪器构件与刻度权重 */
  --sw-brass-600: #8a6f3d;
  --sw-brass-500: #a98a4f;
  --sw-brass-400: #c0a86b;
  --sw-brass-300: #d9c9a3;
  --sw-brass-100: #ece3cf;

  /* 朱红 —— 全站唯一强调色。指针、需人工确认、当前读数 */
  --sw-vermilion-600: #a8321c;
  --sw-vermilion-500: #c2410c;
  --sw-vermilion-300: #e8a08c;
  --sw-vermilion-100: #f7e2da;

  /* 靛蓝 —— 深海，用于反相区块（不用深绿，绿要留给"已校准"） */
  --sw-abyss-900: #14201f;
  --sw-abyss-800: #1c2b2a;
  --sw-abyss-700: #263836;

  /* 铜绿 —— 唯一语义：已校准的证据。不做品牌色 */
  --sw-verdigris-600: #2f6b57;
  --sw-verdigris-500: #3d8a70;
  --sw-verdigris-200: #b3d6c8;

  --sw-white: #ffffff;
  --sw-black: #000000;
}

/* ─────────────────────── L2 · 语义 token ─────────────────────── */

:root {
  /* 表面 */
  --surface-sunk: var(--sw-paper-100);
  --surface-base: var(--sw-paper-000);
  --surface-raised: #f8f7f4;
  --surface-inverse: var(--sw-abyss-900);

  /* 文字 */
  --text-primary: var(--sw-ink-900);
  --text-secondary: var(--sw-ink-700);
  --text-tertiary: var(--sw-ink-500);
  --text-faint: var(--sw-ink-400);
  --text-on-inverse: #e8eae9;
  --text-on-inverse-dim: #9aa5a3;

  /* 线 —— 三档线宽建立层级，替代阴影 */
  --rule-strong: var(--sw-ink-900);
  --rule-mid: var(--sw-paper-200);
  --rule-hair: var(--sw-paper-150);

  /* 状态 —— 语义唯一，不复用 */
  --state-attention: var(--sw-vermilion-500);
  --state-attention-weak: var(--sw-vermilion-100);
  --state-calibrated: var(--sw-verdigris-600);
  --state-calibrated-weak: var(--sw-verdigris-200);
  --state-idle: var(--sw-ink-300);

  /* 仪器 */
  --instrument-tick: rgba(22, 24, 26, 0.42);
  --instrument-tick-minor: rgba(22, 24, 26, 0.16);
  --instrument-plate: rgba(22, 24, 26, 0.05);
  --instrument-brass: var(--sw-brass-500);
  --instrument-brass-weak: var(--sw-brass-100);
  --instrument-needle: var(--sw-vermilion-600);

  /* 圆角 —— 只有三档 + 圆 */
  --r-tight: 2px;
  --r-base: 6px;
  --r-soft: 14px;

  /* 阴影 —— 零饱和度 */
  --shadow-lift: 0 1px 2px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-panel: 0 1px 1px rgba(0, 0, 0, 0.03), 0 8px 24px rgba(0, 0, 0, 0.05);

  /* 字体 —— 全部免费可商用 */
  --font-serif: "Noto Serif SC", "Songti SC", serif;
  --font-sans: "Noto Sans SC", -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;

  /* 动效 —— 三档时长 + 两条曲线 */
  --dur-micro: 120ms;
  --dur-move: 280ms;
  --dur-stage: 620ms;
  --ease-out: cubic-bezier(0.2, 0, 0.38, 0.9);
  --ease-far: cubic-bezier(0.19, 1, 0.22, 1);
  /* 棘轮咬合：走到位就停，不回弹（不越过 y=1） */
  --ease-detent: cubic-bezier(0.16, 0.9, 0.2, 1);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-micro: 0s;
    --dur-move: 0s;
    --dur-stage: 0s;
  }
  *,
  *::before,
  *::after {
    animation-duration: 0.001s !important;
    animation-iteration-count: 1 !important;
  }
}

/* ─────────────────────── 基础 ─────────────────────── */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--surface-base);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.68;
  font-weight: 350;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  /* 海图网格：环境层，极低对比 */
  background-image:
    linear-gradient(rgba(22, 24, 26, 0.019) 1px, transparent 1px),
    linear-gradient(90deg, rgba(22, 24, 26, 0.019) 1px, transparent 1px);
  background-size: 56px 56px;
}

:focus-visible {
  outline: 2px solid var(--state-attention);
  outline-offset: 2px;
}

/* ─────────────────────── 排版 ─────────────────────── */

h1,
h2,
h3,
h4 {
  margin: 0;
  font-family: var(--font-serif);
  font-weight: 400;
  color: var(--text-primary);
  /* 汉字是等宽方块，收紧只会糊成一坨 —— 字距为正 */
  letter-spacing: 0.015em;
  text-wrap: balance;
}

h1 {
  font-size: clamp(34px, 4.4vw, 62px);
  line-height: 1.12;
}
h2 {
  font-size: clamp(24px, 2.5vw, 34px);
  line-height: 1.2;
}
h3 {
  font-size: 19px;
  line-height: 1.35;
}

p {
  margin: 0 0 1em;
  color: var(--text-secondary);
  max-width: 68ch;
}

a {
  color: var(--text-primary);
  text-decoration-color: var(--sw-paper-200);
  text-underline-offset: 3px;
  transition: text-decoration-color var(--dur-micro) var(--ease-out);
}
a:hover {
  text-decoration-color: var(--state-attention);
}

/* 拉丁与数字：等宽 + 表格数字，读数必须对齐 */
.mono,
.numeral {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* 罗经方位标签 —— 替代 uppercase+letter-spacing 的 eyebrow 胶囊 */
.bearing {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--text-faint);
  text-transform: uppercase;
}

/* ─────────────────────── 按钮 ─────────────────────── */

button,
.button {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.02em;
  /* 仪器按钮是方的，不是药丸 */
  border-radius: var(--r-tight);
  padding: 11px 20px;
  border: 1px solid var(--rule-strong);
  background: var(--text-primary);
  color: var(--sw-paper-000);
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition:
    transform var(--dur-micro) var(--ease-out),
    background-color var(--dur-micro) var(--ease-out),
    border-color var(--dur-micro) var(--ease-out);
}
button:hover:not(:disabled),
.button:hover {
  transform: translateY(-1px);
}
button:active:not(:disabled) {
  transform: translateY(0);
}
button:disabled {
  opacity: 0.38;
  cursor: not-allowed;
}

button.secondary,
.button.secondary {
  background: transparent;
  color: var(--text-primary);
  border-color: var(--rule-mid);
}
button.secondary:hover:not(:disabled) {
  border-color: var(--rule-strong);
}

button.quiet {
  background: transparent;
  border-color: transparent;
  color: var(--text-tertiary);
  padding: 6px 8px;
}
button.quiet:hover:not(:disabled) {
  color: var(--text-primary);
}

/* ─────────────────────── 表单 · 航海日志 ─────────────────────── */
/* 核心修正：待填字段是视觉主角。写字的地方是基线，不是盒子。 */

label {
  display: block;
  margin-bottom: 22px;
}

/* 字段名 —— 深色、可读。旧版 #c9d0ca 在浅底上几乎隐形，是真 bug */
.field-name {
  display: block;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--text-primary);
  margin-bottom: 2px;
}

.field-hint {
  display: block;
  font-size: 12px;
  color: var(--text-tertiary);
  margin-bottom: 10px;
}

input[type="text"],
input[type="url"],
input[type="email"],
textarea,
select {
  width: 100%;
  font-family: var(--font-sans);
  /* 主角尺寸：填写是"书写"，不是"提交数据" */
  font-size: 19px;
  font-weight: 350;
  line-height: 1.6;
  color: var(--text-primary);
  background: transparent;
  border: 0;
  /* 只留一条基线 */
  border-bottom: 1px solid var(--rule-mid);
  border-radius: 0;
  padding: 8px 2px;
  transition:
    border-color var(--dur-micro) var(--ease-out),
    background-color var(--dur-micro) var(--ease-out);
}

input:hover,
textarea:hover {
  border-bottom-color: var(--sw-ink-300);
}

input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-bottom-color: var(--state-attention);
  border-bottom-width: 2px;
  background: rgba(255, 255, 255, 0.5);
  padding-bottom: 7px;
}

textarea {
  min-height: 92px;
  resize: vertical;
}

/* 权重分层：重字段更大更高，轻字段收窄 */
textarea.weight-primary {
  font-size: 21px;
  min-height: 116px;
}
input.weight-tertiary,
textarea.weight-tertiary {
  font-size: 15px;
  min-height: 56px;
  font-family: var(--font-mono);
}

::placeholder {
  color: var(--sw-ink-300);
  font-weight: 300;
}

input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--state-attention);
}

select {
  font-size: 14px;
  border: 1px solid var(--rule-mid);
  border-radius: var(--r-tight);
  padding: 7px 10px;
  background: var(--surface-raised);
}

[role="alert"] {
  color: var(--state-attention);
  font-size: 13px;
  border-left: 2px solid var(--state-attention);
  padding-left: 12px;
  margin: 16px 0;
  background: var(--state-attention-weak);
  padding: 10px 12px;
}

/* ─────────────────────── 面板 · 标尺线，不是圆角卡片 ─────────────────────── */
/* 圆角白卡 + 彩色阴影是模板签名。仪器面板靠一条顶部标尺线分层。 */

.plate {
  padding: 22px 0 26px;
  border-top: 1px solid var(--rule-strong);
  background: transparent;
}
.plate-quiet {
  border-top-color: var(--rule-hair);
}
.plate-kicker {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin: 0 0 12px;
}

/* 读数行 —— 名值对，靠基线对齐，不做卡片行（避开 stat_banner_row 检测） */
.readout {
  display: grid;
  grid-template-columns: minmax(90px, 34%) 1fr;
  gap: 4px 16px;
  padding: 9px 0;
  border-bottom: 1px solid var(--rule-hair);
  align-items: baseline;
}
.readout dt,
.readout .r-key {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin: 0;
}
.readout dd,
.readout .r-val {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}

/* ─────────────────────── 状态标记 ─────────────────────── */

.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}
.status::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--state-idle);
  flex: none;
}
.status[data-state="running"]::before {
  background: var(--state-attention);
  animation: tickPulse 1.9s var(--ease-out) infinite;
}
.status[data-state="completed"]::before,
.status[data-state="validated"]::before,
.status[data-state="proceed"]::before {
  background: var(--state-calibrated);
}
.status[data-state="failed"]::before,
.status[data-state="attention"]::before,
.status[data-state="blocked"]::before {
  background: var(--state-attention);
}

@keyframes tickPulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.28;
  }
}

/* ─────────────────────── 外壳 ─────────────────────── */

.app-frame {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.demo-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 9px 20px;
  background: var(--surface-inverse);
  color: var(--text-on-inverse);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
}
.demo-banner a {
  color: var(--sw-brass-300);
  text-decoration-color: var(--sw-brass-600);
}

/* 顶栏：无毛玻璃（backdrop-filter 是 slop 检测项），实心纸面 + 一条线 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  flex-wrap: wrap;
  padding: 16px clamp(20px, 3vw, 44px);
  background: var(--surface-base);
  border-bottom: 1px solid var(--rule-strong);
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  text-decoration: none;
}
.brand-mark {
  width: 34px;
  height: 34px;
  flex: none;
}
.brand-name {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 0.03em;
  line-height: 1.2;
  display: block;
}
.brand-sub {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--text-faint);
  text-transform: uppercase;
  display: block;
}

.topnav {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.topnav a {
  padding: 7px 13px;
  font-size: 13px;
  border-radius: var(--r-tight);
  text-decoration: none;
  color: var(--text-secondary);
  border: 1px solid transparent;
  transition:
    border-color var(--dur-micro) var(--ease-out),
    color var(--dur-micro) var(--ease-out);
}
.topnav a:hover {
  color: var(--text-primary);
  border-color: var(--rule-mid);
}
.topnav a[aria-current="page"] {
  border-color: var(--rule-strong);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}

.workspace-main {
  flex: 1;
  width: min(1520px, calc(100% - 40px));
  margin: 0 auto;
  padding: 40px 0 76px;
}

.app-footer {
  border-top: 1px solid var(--rule-hair);
  padding: 22px clamp(20px, 3vw, 44px);
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.09em;
  color: var(--text-faint);
  text-transform: uppercase;
}

/* 页头 */
.page-head {
  margin-bottom: 34px;
  padding-bottom: 26px;
  border-bottom: 1px solid var(--rule-strong);
}
.page-head .bearing {
  margin-bottom: 14px;
}
.page-head p {
  margin: 16px 0 0;
  font-size: 16px;
  color: var(--text-tertiary);
}
.page-head-row {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
}

/* ─────────────────────── 罗经工作台 ─────────────────────── */

.binnacle {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 388px);
  gap: 0;
  align-items: start;
  border-top: 1px solid var(--rule-strong);
}
.binnacle-plate {
  position: relative;
  min-width: 0;
  padding: 12px 30px 30px 0;
}
.binnacle-side {
  min-width: 0;
  padding: 12px 0 30px 30px;
  border-left: 1px solid var(--rule-hair);
}

/* 罗盘容器：SVG 自适应，不用硬编码 px 半径 */
.compass {
  position: relative;
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  aspect-ratio: 1;
}
.compass svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* 刻度与铭文 —— 环境层，低对比，不与内容抢注意力 */
.tick-major {
  stroke: var(--instrument-tick);
  stroke-width: 1.4;
}
.tick-minor {
  stroke: var(--instrument-tick-minor);
  stroke-width: 0.8;
}
.plate-ring {
  fill: none;
  stroke: var(--instrument-tick-minor);
  stroke-width: 1;
}
.plate-ring-strong {
  fill: none;
  stroke: var(--instrument-tick);
  stroke-width: 1.2;
}
.plate-face {
  fill: var(--instrument-plate);
}
.rhumb {
  stroke: var(--instrument-tick-minor);
  stroke-width: 0.6;
  stroke-dasharray: 2 6;
}
.degree-label,
.point-label {
  fill: var(--text-faint);
  font-family: var(--font-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
  text-anchor: middle;
  dominant-baseline: middle;
}
.point-label-cardinal {
  fill: var(--text-secondary);
  font-weight: 600;
  font-size: 13px;
}
.rim-inscription {
  fill: var(--text-faint);
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.18em;
}

/* 可转层 —— 棘轮定格，走到位就停 */
.rete {
  transition: transform var(--dur-stage) var(--ease-detent);
}
.mater-ring {
  transition: transform var(--dur-stage) var(--ease-detent);
}

/* 指针 */
.needle {
  cursor: pointer;
}
.needle-body {
  fill: var(--surface-raised);
  stroke: var(--instrument-tick);
  stroke-width: 1.2;
  transition:
    fill var(--dur-micro) var(--ease-out),
    stroke var(--dur-micro) var(--ease-out);
}
.needle:hover .needle-body {
  stroke: var(--text-primary);
  stroke-width: 1.6;
}
.needle[data-state="running"] .needle-body {
  fill: var(--state-attention-weak);
  stroke: var(--instrument-needle);
  stroke-width: 1.6;
}
.needle[data-state="completed"] .needle-body,
.needle[data-state="validated"] .needle-body {
  fill: var(--state-calibrated-weak);
  stroke: var(--state-calibrated);
}
.needle-caption {
  fill: var(--text-tertiary);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  text-anchor: middle;
  opacity: 0;
  transition: opacity var(--dur-move) var(--ease-out);
  pointer-events: none;
}
/* 默认只留剪影，凑近才读数 —— 盘面保持干净 */
.needle:hover .needle-caption,
.needle:focus-visible .needle-caption,
.needle[data-open="true"] .needle-caption {
  opacity: 1;
}

/* 扇区 —— 可点，落定有棘轮咬合感 */
.sector {
  cursor: pointer;
}
.sector-face {
  fill: transparent;
  stroke: var(--instrument-tick-minor);
  stroke-width: 1;
  transition:
    fill var(--dur-micro) var(--ease-out),
    stroke var(--dur-micro) var(--ease-out);
}
.sector:hover .sector-face {
  fill: rgba(22, 24, 26, 0.028);
  stroke: var(--instrument-tick);
}
.sector[data-active="true"] .sector-face {
  fill: var(--state-attention-weak);
  stroke: var(--instrument-needle);
  stroke-width: 1.4;
}
.sector-num {
  fill: var(--text-faint);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-anchor: middle;
}
.sector-name {
  fill: var(--text-secondary);
  font-family: var(--font-serif);
  font-size: 15px;
  letter-spacing: 0.03em;
  text-anchor: middle;
}
.sector[data-active="true"] .sector-name {
  fill: var(--instrument-needle);
}
.sector-fill {
  fill: var(--text-faint);
  font-family: var(--font-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  text-anchor: middle;
}

/* 中心读数 —— 整台仪器的结论，视线终点 */
.compass-core {
  fill: var(--surface-raised);
  stroke: var(--text-primary);
  stroke-width: 1.4;
}
.core-read {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 27%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  pointer-events: none;
}
.core-rev {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--text-faint);
  text-transform: uppercase;
}
.core-name {
  margin: 6px 0 0;
  font-family: var(--font-serif);
  font-size: clamp(13px, 1.15vw, 18px);
  font-weight: 500;
  line-height: 1.24;
  letter-spacing: 0.02em;
  color: var(--text-primary);
  overflow-wrap: anywhere;
}
.core-stage {
  margin: 4px 0 0;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text-tertiary);
  text-transform: uppercase;
}
.core-figure {
  display: flex;
  align-items: baseline;
  gap: 2px;
  margin-top: 12px;
  font-family: var(--font-mono);
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.core-figure b {
  font-size: clamp(30px, 3.4vw, 52px);
  font-weight: 400;
  letter-spacing: -0.03em;
  line-height: 1;
}
.core-figure i {
  font-style: normal;
  font-size: 13px;
  color: var(--text-faint);
}
.core-figure-label {
  margin: 2px 0 0;
  font-size: 10px;
  font-family: var(--font-mono);
  letter-spacing: 0.1em;
  color: var(--text-faint);
  text-transform: uppercase;
}
.core-cta {
  margin-top: 14px;
  pointer-events: auto;
  font-size: 12px;
  padding: 9px 15px;
}

/* 棘轮刻度条 —— 逐格揭示，每格对应一个真实事件 */
.detent-bar {
  display: flex;
  gap: 3px;
  margin: 14px 0 0;
}
.detent-bar i {
  flex: 1;
  height: 12px;
  background: var(--sw-paper-150);
  border-radius: 0;
  transition:
    background-color var(--dur-move) var(--ease-detent),
    transform var(--dur-move) var(--ease-detent);
  transform-origin: bottom;
}
.detent-bar i[data-lit="true"] {
  background: var(--instrument-needle);
  transform: scaleY(1.5);
}

/* ─────────────────────── 资料录入 · 航海日志 ─────────────────────── */

.logbook {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr) 268px;
  gap: 0;
  border-top: 1px solid var(--rule-strong);
  align-items: start;
}

/* 左舷刻度尺 —— 竖线 + 当前位置朱红标记，不是圆角选中卡片 */
.log-rail {
  padding: 20px 22px 30px 0;
  border-right: 1px solid var(--rule-hair);
}
.log-rail button {
  position: relative;
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px 0 12px 18px;
  background: transparent;
  border: 0;
  border-radius: 0;
  color: var(--text-tertiary);
  transition: color var(--dur-micro) var(--ease-out);
}
.log-rail button::before {
  content: "";
  position: absolute;
  left: 0;
  top: 12px;
  bottom: 12px;
  width: 1px;
  background: var(--rule-mid);
  transition:
    background-color var(--dur-micro) var(--ease-out),
    width var(--dur-micro) var(--ease-out);
}
.log-rail button:hover {
  color: var(--text-primary);
}
.log-rail button[aria-current="true"] {
  color: var(--text-primary);
}
.log-rail button[aria-current="true"]::before {
  background: var(--instrument-needle);
  width: 2px;
}
.log-rail .r-idx {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--text-faint);
}
.log-rail .r-title {
  display: block;
  font-size: 14px;
  font-weight: 500;
  margin: 3px 0 2px;
}
.log-rail .r-meta {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

/* 中央书写区 */
.log-sheet {
  padding: 20px clamp(24px, 3vw, 44px) 40px;
  min-width: 0;
}
.log-sheet-head {
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--rule-hair);
}
.log-sheet-head h2 {
  margin: 10px 0 8px;
}
.log-sheet-head > span {
  display: block;
  font-size: 13px;
  color: var(--text-tertiary);
  max-width: 60ch;
}

.field-set {
  display: grid;
  gap: 4px;
}

.log-sheet details {
  margin: 26px 0;
  padding: 18px 0;
  border-top: 1px solid var(--rule-hair);
  border-bottom: 1px solid var(--rule-hair);
}
.log-sheet summary {
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 14px;
  color: var(--text-secondary);
}

.drop-zone {
  position: relative;
  display: block;
}
.drop-zone input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.drop-zone > span {
  display: block;
  padding: 20px;
  border: 1px dashed var(--rule-mid);
  border-radius: var(--r-tight);
  color: var(--text-tertiary);
  font-size: 12px;
  transition: border-color var(--dur-micro) var(--ease-out);
}
.drop-zone:hover > span {
  border-color: var(--text-faint);
}

.consent-row {
  display: grid !important;
  grid-template-columns: 18px 1fr;
  gap: 10px;
  align-items: start;
  margin: 18px 0;
}
.consent-row span {
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-tertiary);
}

.form-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 30px;
  padding-top: 22px;
  border-top: 1px solid var(--rule-strong);
}

.file-status {
  margin: 10px 0 0;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.6;
  color: var(--state-calibrated);
}

/* 右舷助手 —— 去掉深色块，同色纸面 + 分隔线（深块会抢走表单注意力） */
.log-aside {
  padding: 20px 0 30px 26px;
  border-left: 1px solid var(--rule-hair);
  min-width: 0;
}
.log-aside h3 {
  font-family: var(--font-serif);
  font-size: 22px;
  margin: 10px 0 12px;
}
.log-aside > p {
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-tertiary);
}
.boundary-list {
  margin: 26px 0 0;
  padding: 18px 0 0;
  border-top: 1px solid var(--rule-hair);
}
.boundary-list strong {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.boundary-list ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 11px;
}
.boundary-list li {
  font-size: 12px;
  line-height: 1.55;
  color: var(--text-tertiary);
  padding-left: 16px;
  position: relative;
}
.boundary-list li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 8px;
  width: 6px;
  height: 1px;
  background: var(--state-calibrated);
}

/* 画像复核 */
.profile-review {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 30px;
}
.question-stack {
  display: grid;
  gap: 8px;
}
.question-stack label {
  padding: 18px 0;
  border-bottom: 1px solid var(--rule-hair);
}

.planned-state {
  min-height: 440px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 14px;
}
.planned-state .seal {
  width: 62px;
  height: 62px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1.4px solid var(--state-calibrated);
  color: var(--state-calibrated);
  font-size: 24px;
}

/* ─────────────────────── 通用网格与列表 ─────────────────────── */

.grid-auto {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 0 32px;
}

.record-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.record-list > li,
.record-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 18px;
  padding: 15px 0;
  border-bottom: 1px solid var(--rule-hair);
}
.record-row:hover {
  background: rgba(255, 255, 255, 0.4);
}

/* 时间线 */
.timeline {
  list-style: none;
  margin: 0;
  padding: 0;
}
.timeline li {
  position: relative;
  padding: 0 0 22px 24px;
  border-left: 1px solid var(--rule-mid);
}
.timeline li::before {
  content: "";
  position: absolute;
  left: -3.5px;
  top: 7px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-faint);
}
.timeline li:last-child {
  border-left-color: transparent;
}
.timeline pre {
  font-family: var(--font-mono);
  font-size: 11px;
  overflow-x: auto;
  color: var(--text-tertiary);
  margin: 6px 0 0;
}

/* 证据链 */
.evidence-chain {
  list-style: none;
  margin: 0;
  padding: 0;
  counter-reset: ev;
}
.evidence-chain > li {
  counter-increment: ev;
  border-bottom: 1px solid var(--rule-hair);
}
.evidence-chain summary {
  cursor: pointer;
  padding: 14px 0;
  font-size: 14px;
}
.evidence-chain summary::marker {
  color: var(--text-faint);
}
.evidence-chain dl {
  margin: 0 0 16px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 16px;
  font-size: 13px;
}
.evidence-chain dt {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text-faint);
  text-transform: uppercase;
}
.evidence-chain dd {
  margin: 0;
  color: var(--text-secondary);
}

/* 空态 */
.empty-state {
  padding: 70px 0;
  text-align: center;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
}

/* 登录 */
.harbor {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 40px 20px;
}
.harbor-inner {
  width: min(520px, 100%);
}
.harbor h1 {
  margin: 14px 0 12px;
}
.harbor-note {
  border-left: 2px solid var(--instrument-brass);
  padding: 12px 0 12px 14px;
  margin: 26px 0;
  background: var(--instrument-brass-weak);
  padding-right: 14px;
}
.harbor-note strong {
  display: block;
  font-size: 12px;
  margin-bottom: 4px;
  color: var(--sw-brass-600);
}
.harbor-note span {
  font-size: 12px;
  color: var(--text-tertiary);
  line-height: 1.6;
}

/* 表格 */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th,
td {
  text-align: left;
  padding: 11px 12px 11px 0;
  border-bottom: 1px solid var(--rule-hair);
}
th {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text-faint);
  text-transform: uppercase;
  font-weight: 500;
}
td {
  font-variant-numeric: tabular-nums;
}

/* 入场：极端 ease-out，不越过 y=1，不回弹 */
@keyframes make-way {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.enters {
  animation: make-way var(--dur-stage) var(--ease-far) both;
}

/* ─────────────────────── 响应式 ─────────────────────── */

@media (max-width: 1180px) {
  .binnacle,
  .logbook {
    grid-template-columns: minmax(0, 1fr);
  }
  .binnacle-plate {
    padding: 12px 0 30px;
  }
  .binnacle-side,
  .log-aside {
    border-left: 0;
    border-top: 1px solid var(--rule-strong);
    padding: 24px 0 30px;
  }
  .log-rail {
    border-right: 0;
    border-bottom: 1px solid var(--rule-hair);
    padding: 16px 0;
    display: flex;
    gap: 4px;
    overflow-x: auto;
  }
  .log-rail button {
    flex: none;
    min-width: 152px;
    padding: 10px 12px;
  }
  .log-rail button::before {
    left: 0;
    right: 0;
    top: auto;
    bottom: 0;
    width: auto;
    height: 1px;
  }
  .log-rail button[aria-current="true"]::before {
    width: auto;
    height: 2px;
  }
  .log-sheet {
    padding: 24px 0 36px;
  }
  .profile-review {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 720px) {
  body {
    font-size: 14px;
  }
  input[type="text"],
  input[type="url"],
  textarea {
    font-size: 17px;
  }
  textarea.weight-primary {
    font-size: 18px;
  }
  .workspace-main {
    width: calc(100% - 28px);
    padding: 26px 0 50px;
  }
}
