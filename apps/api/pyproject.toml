[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "launchscope-api"
version = "0.1.0"
description = "LaunchScope FastAPI modular control-plane boundary"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
  "launchscope-domain>=0.1.0",
  "launchscope-orchestrator>=0.1.0",
  "launchscope-skills>=0.1.0",
  "launchscope-worker>=0.1.0",
  "rocketmq-python-client==5.1.1",
  "mcp==2.0.0"
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
launchscope_api = ["py.typed"]
