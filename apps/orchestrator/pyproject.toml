[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "launchscope-orchestrator"
version = "0.1.0"
description = "LaunchScope AgentTeams and Matrix orchestration boundary"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0.2,<7",
  "launchscope-domain>=0.1.0",
  "launchscope-skills>=0.1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
launchscope_orchestrator = ["py.typed"]
